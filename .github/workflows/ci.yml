name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      # pnpm must be on PATH before actions/setup-node so its `cache: pnpm`
      # option can resolve the pnpm store path.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sets NX_BASE/NX_HEAD so `nx affected` only runs against what
      # actually changed relative to main (or the last successful run on
      # push to main), not the whole monorepo every time.
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - name: Lint affected projects
        run: pnpm exec nx affected -t lint

      # --parallel=1: one project's tests at a time. Each Jest run already
      # spreads across all runner cores with its own workers; with Nx's
      # default of 3 parallel tasks, api/dashboard/mobile Jest processes
      # oversubscribe the 4-vCPU runner and mobile's heavier screen tests
      # (ChatScreen, MenuScreen) hit random 5s/30s timeouts. Every suite
      # passes reliably when run alone.
      - name: Test affected projects
        run: pnpm exec nx affected -t test --parallel=1

      # Excludes mobile: its inferred "build" target is @nx/expo:build
      # (EAS cloud build, needs credentials/macOS signing we don't have
      # in CI yet). api/dashboard/landing build normally here.
      - name: Build affected projects
        run: pnpm exec nx affected -t build --exclude=mobile

      # Mobile's JS/TS bundle only (expo export via Metro) -- no native
      # Gradle/Xcode compile, no EAS. Only mobile defines this target.
      - name: Build mobile JS bundle
        run: pnpm exec nx affected -t export

      # Default threshold (low) fails the build on every low-severity
      # advisory across the workspace's manifests, which is too noisy to
      # gate merges on. Only high/critical block CI; lower severities still
      # show up in the Snyk report.
      # --exclude only matches directory/file names, not paths (a Snyk CLI
      # constraint), so "dist,.nx" drops dist/apps/api/pnpm-lock.yaml and
      # .nx/cache/**/dist/apps/api/pnpm-lock.yaml -- otherwise --all-projects
      # picks those compiled-output lockfiles up as extra "projects" and
      # duplicates the real api project's results.
      # --fail-on=all still reports every high/critical finding, but only
      # fails the build when at least one has a computed fix (upgrade or
      # patch) available -- "all" means upgradable OR patchable, unlike
      # --fail-on=upgradable, which ignores patch-only fixes. Findings with no
      # fix path yet (e.g. transitive deps like fast-uri, or image-size, whose
      # fix needs a major bump metro doesn't allow, as of this writing) stop
      # blocking merges on something nobody can act on today, and
      # automatically start blocking again once a fix ships upstream.
      # Transitive runtime deps we can patch without a major bump are pinned
      # via "pnpm.overrides" in the root package.json.
      # --policy-path=.snyk: Snyk applies a .snyk file only to projects found
      # on its own path, and --all-projects detects apps/mobile and
      # apps/landing as separate projects -- point every project at the
      # single root policy explicitly (Snyk's documented approach for a
      # centralized policy in a monorepo).
      - name: Snyk dependency vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --exclude=dist,.nx --fail-on=all --policy-path=.snyk
